name: Firebase hosting

on:
  push:
    branches: [production, staging, development]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE, so the job can access it
      - uses: actions/checkout@v2

      - name: Install firebase tools
        run: |
          sudo npm install -g firebase-tools
          firebase use parami-project --token ${{ secrets.FIREBASE_TOKEN }}

      - name: Install Dependencies
        run: npm install 

      - name: Deploy to development site
        if: github.ref == 'refs/heads/development'
        run: |
          touch .env
          echo VITE_API_URL=${{ secrets.DEVELOPMENT_API_URL }} >> .env
          npm run build
          firebase deploy --only hosting:development --non-interactive --token ${{ secrets.FIREBASE_TOKEN }} -m "RunID ${{ github.run_id }} Commit SHA ${{ github.sha }}"

      - name: Deploy to staging site
        if: github.ref == 'refs/heads/staging'
        run: |
          touch .env
          echo VITE_API_URL=${{ secrets.STAGING_API_URL }} >> .env
          npm run build
          firebase deploy --only hosting:staging --non-interactive --token ${{ secrets.FIREBASE_TOKEN }} -m "RunID ${{ github.run_id }} Commit SHA ${{ github.sha }}"
      
      - name: Deploy to production site
        if: github.ref == 'refs/heads/production'
        run: |
          touch .env
          echo VITE_API_URL=${{ secrets.PRODUCTION_API_URL }} >> .env
          npm run build
          firebase deploy --only hosting:production --non-interactive --token ${{ secrets.FIREBASE_TOKEN }} -m "RunID ${{ github.run_id }} Commit SHA ${{ github.sha }}"

      - name: Archive build Artifact
        uses: actions/upload-artifact@master
        with:
          path: build